server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/manifest+json;

    # файлы сборки с хэшем в имени — кэшируем надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PWA: service worker и манифест всегда проверяются заново, иначе обновления не дойдут
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA: все остальные пути отдают index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
